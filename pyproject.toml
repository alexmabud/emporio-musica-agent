[project]
name = "emporio-musica-agent"
version = "0.1.0"
description = "Customer service agent for Empório da Música, a fictional musical instrument store."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: isort, UP: pyupgrade, B: bugbear, D: docstrings (Google style).
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
